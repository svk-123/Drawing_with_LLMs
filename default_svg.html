<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree with falling leaves -->
  <g>
    <circle cx="400" cy="200" r="50" fill="green" />
    <rect x="395" y="250" width="10" height="100" fill="saddlebrown" />
    <circle cx="360" cy="230" r="10" fill="green" opacity="0.6" />
    <circle cx="440" cy="230" r="10" fill="green" opacity="0.6" />
  </g>

  <!-- Abstract geometric shapes -->
  <g>
    <rect x="50" y="400" width="150" height="150" fill="purple" opacity="0.5" />
    <circle cx="250" cy="475" r="70" fill="orange" opacity="0.6" />
    <polygon points="400,400 470,475 330,475" fill="cyan" opacity="0.7" />
  </g>

  <!-- Colorful sunset over mountains -->
  <g>
    <rect x="0" y="0" width="800" height="400" fill="orange" />
    <polygon points="0,400 200,200 400,400" fill="brown" />
    <polygon points="400,400 600,200 800,400" fill="brown" />
    <circle cx="650" cy="300" r="60" fill="yellow" />
  </g>

  <!-- Minimalist cityscape at night -->
  <g>
    <rect x="50" y="550" width="100" height="250" fill="black" />
    <rect x="200" y="500" width="150" height="300" fill="darkgrey" />
    <rect x="400" y="600" width="100" height="200" fill="black" />
    <circle cx="250" cy="650" r="5" fill="yellow" />
    <circle cx="350" cy="570" r="5" fill="yellow" />
  </g>

  <!-- Vibrant autumn forest -->
  <g>
    <circle cx="100" cy="600" r="60" fill="darkorange" />
    <circle cx="200" cy="570" r="50" fill="red" />
    <circle cx="300" cy="610" r="55" fill="gold" />
    <rect x="190" y="650" width="20" height="100" fill="saddlebrown" />
  </g>

  <!-- Stylized ocean waves -->
  <g>
    <path d="M0,750 Q200,600 400,750 T800,750" fill="blue" opacity="0.6" />
    <path d="M0,725 Q200,575 400,725 T800,725" fill="blue" opacity="0.6" />
  </g>

  <!-- Abstract floral patterns -->
  <g>
    <circle cx="600" cy="100" r="30" fill="pink" />
    <circle cx="650" cy="150" r="20" fill="purple" />
    <circle cx="670" cy="100" r="15" fill="yellow" />
  </g>

  <!-- Modern skyscraper skyline -->
  <g>
    <rect x="50" y="400" width="100" height="300" fill="gray" />
    <rect x="200" y="350" width="150" height="350" fill="silver" />
    <rect x="400" y="300" width="100" height="400" fill="darkgrey" />
    <rect x="550" y="250" width="80" height="450" fill="black" />
  </g>

  <!-- Desert landscape with cacti -->
  <g>
    <polygon points="0,750 800,750 800,600 0,600" fill="yellow" />
    <rect x="150" y="500" width="40" height="100" fill="green" />
    <rect x="200" y="450" width="40" height="150" fill="green" />
    <rect x="600" y="510" width="30" height="90" fill="green" />
  </g>

  <!-- Abstract art with circles -->
  <g>
    <circle cx="50" cy="100" r="40" fill="red" opacity="0.7" />
    <circle cx="150" cy="200" r="50" fill="blue" opacity="0.5" />
    <circle cx="300" cy="100" r="60" fill="green" opacity="0.6" />
  </g>

  <!-- Fashionable dress with patterns -->
  <g>
    <path d="M250,450 Q300,400 350,450 T450,450" fill="purple" />
    <circle cx="300" cy="460" r="10" fill="yellow" />
    <circle cx="350" cy="460" r="10" fill="yellow" />
  </g>

  <!-- Elegant high-heeled shoe -->
  <g>
    <path d="M100,500 C120,480 160,480 180,500 C190,520 150,540 120,530 C100,520 80,510 100,500" fill="black" />
    <rect x="110" y="530" width="10" height="50" fill="brown" />
  </g>

  <!-- Casual t-shirt with logo -->
  <g>
    <rect x="250" y="400" width="100" height="150" fill="lightblue" />
    <circle cx="300" cy="450" r="15" fill="red" />
  </g>

  <!-- Stylish handbag with zipper -->
  <g>
    <rect x="100" y="400" width="200" height="120" fill="brown" />
    <line x1="100" y1="430" x2="300" y2="430" stroke="black" stroke-width="2" />
    <circle cx="150" cy="500" r="10" fill="gold" />
  </g>

  <!-- Patterned scarf in pastel colors -->
  <g>
    <rect x="50" y="600" width="200" height="30" fill="lightpink" />
    <rect x="50" y="630" width="200" height="30" fill="lightblue" />
    <rect x="50" y="660" width="200" height="30" fill="lightgreen" />
  </g>

  <!-- Abstract pattern of triangles -->
  <g>
    <polygon points="50,700 100,750 150,700" fill="yellow" />
    <polygon points="150,700 200,750 250,700" fill="blue" />
    <polygon points="250,700 300,750 350,700" fill="green" />
  </g>

  <!-- Vintage car silhouette -->
  <g>
    <rect x="200" y="550" width="200" height="50" fill="darkblue" />
    <circle cx="230" cy="600" r="20" fill="black" />
    <circle cx="370" cy="600" r="20" fill="black" />
  </g>

  <!-- Bicycle against a lamppost -->
  <g>
    <circle cx="100" cy="650" r="30" fill="gray" />
    <circle cx="150" cy="650" r="30" fill="gray" />
    <path d="M100,650 L150,650 L125,600" fill="none" stroke="black" stroke-width="4" />
    <rect x="200" y="500" width="10" height="100" fill="gray" />
  </g>

  <!-- Old-fashioned pocket watch -->
  <g>
    <circle cx="600" cy="150" r="50" fill="gold" />
    <circle cx="600" cy="150" r="40" fill="white" />
    <line x1="600" y1="150" x2="600" y2="110" stroke="black" stroke-width="2" />
    <line x1="600" y1="150" x2="640" y2="150" stroke="black" stroke-width="2" />
  </g>

  <!-- Basket of assorted fruits -->
  <g>
    <ellipse cx="400" cy="650" rx="100" ry="50" fill="saddlebrown" />
    <circle cx="370" cy="620" r="20" fill="red" />
    <circle cx="430" cy="620" r="20" fill="yellow" />
    <circle cx="400" cy="600" r="25" fill="green" />
  </g>
</svg>
